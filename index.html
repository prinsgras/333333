<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Superkids Jachtseizoen Foto's</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #f90;
            color: white;
            padding: 20px;
            text-align: center;
        }

        h2 {
            text-align: center;
            margin-top: 40px;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .gallery img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease-in-out;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px 0;
            margin-top: 40px;
        }

        .category {
            margin-bottom: 60px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Superkids Jachtseizoen Foto's</h1>
        <p>Bekijk de hoogtepunten van het Jachtseizoen!</p>
    </header>

    <!-- Held van de Dag -->
    <section class="category">
        <h2>Held van de Dag</h2>
        <div class="gallery">
            <img src="https://picsum.photos/id/1011/600/400" alt="Held 1">
            <img src="https://picsum.photos/id/1012/600/400" alt="Held 2">
            <img src="https://picsum.photos/id/1013/600/400" alt="Held 3">
        </div>
    </section>

    <!-- Jachtmomenten -->
    <section class="category">
        <h2>Jachtmomenten</h2>
        <div class="gallery">
            <img src="https://picsum.photos/id/1021/600/400" alt="Moment 1">
            <img src="https://picsum.photos/id/1022/600/400" alt="Moment 2">
            <img src="https://picsum.photos/id/1023/600/400" alt="Moment 3">
        </div>
    </section>

    <!-- Groepsfoto's -->
    <section class="category">
        <h2>Groepsfoto's</h2>
        <div class="gallery">
            <img src="https://picsum.photos/id/1031/600/400" alt="Groep 1">
            <img src="https://picsum.photos/id/1032/600/400" alt="Groep 2">
            <img src="https://picsum.photos/id/1033/600/400" alt="Groep 3">
        </div>
    </section>

    <footer>
        <p>&copy; 2025 Superkids. Alle rechten voorbehouden.</p>
    </footer>

</body>
</html>
